global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "vm-node-exporters"
    static_configs:
      - targets:
          - "192.168.6.130:9100"
          - "192.168.6.141:9100"
          - "192.168.6.142:9100"

  - job_name: "vm1-edge-services"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "192.168.6.130:8080"

  - job_name: "vm2-business-services"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "192.168.6.141:8101"
          - "192.168.6.141:8102"
          - "192.168.6.141:8103"
          - "192.168.6.141:8104"
          - "192.168.6.141:8105"
          - "192.168.6.141:8107"

  - job_name: "vm3-ai-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "192.168.6.142:8106"


