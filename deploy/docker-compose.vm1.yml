name: ai-campus-recruit-vm1

networks:
  recruit-vm1-net:
    driver: bridge

volumes:
  nacos-data:
  prometheus-data:
  grafana-data:

services:
  nacos:
    image: docker.m.daocloud.io/nacos/nacos-server:v2.4.3
    container_name: recruit-vm1-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - recruit-vm1-net

  sentinel-dashboard:
    image: registry.cn-hangzhou.aliyuncs.com/xfg-studio/sentinel-dashboard:1.8.7
    container_name: recruit-vm1-sentinel-dashboard
    restart: unless-stopped
    entrypoint:
      - java
      - "-Djava.security.egd=file:/dev/./urandom"
      - "-Dserver.port=8858"
      - "-Dcsp.sentinel.api.port=8719"
      - "-Dcsp.sentinel.dashboard.server=sentinel-dashboard:8858"
      - "-Dproject.name=sentinel-dashboard"
      - "-Dsentinel.dashboard.auth.username=${SENTINEL_DASHBOARD_USER:-sentinel}"
      - "-Dsentinel.dashboard.auth.password=${SENTINEL_DASHBOARD_PASSWORD:-replace-with-a-strong-sentinel-password}"
      - "-jar"
      - "app.jar"
    ports:
      - "${SENTINEL_DASHBOARD_PORT:-8858}:8858"
    networks:
      - recruit-vm1-net

  gateway-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: gateway-service
    container_name: recruit-vm1-gateway-service
    restart: unless-stopped
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      AUTH_SERVICE_URI: http://${VM2_HOST}:8101
      USER_SERVICE_URI: http://${VM2_HOST}:8102
      RESUME_SERVICE_URI: http://${VM2_HOST}:8103
      JOB_SERVICE_URI: http://${VM2_HOST}:8104
      MATCH_SERVICE_URI: http://${VM2_HOST}:8105
      DELIVERY_SERVICE_URI: http://${VM2_HOST}:8107
      AI_SERVICE_URI: http://${VM3_HOST}:8106
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-ai-campus-recruit}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-86400}
      GATEWAY_AUTH_ENABLED: ${GATEWAY_AUTH_ENABLED:-true}
      GATEWAY_PUBLIC_DOCS_ENABLED: ${GATEWAY_PUBLIC_DOCS_ENABLED:-false}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-http://localhost}
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel-dashboard:8858
      SPRING_CLOUD_SENTINEL_TRANSPORT_PORT: 8719
      SPRING_CLOUD_SENTINEL_EAGER: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    depends_on:
      nacos:
        condition: service_healthy
      sentinel-dashboard:
        condition: service_started
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - recruit-vm1-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    container_name: recruit-vm1-frontend
    restart: unless-stopped
    environment:
      GATEWAY_UPSTREAM: http://gateway-service:8080
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - recruit-vm1-net

  node-exporter:
    image: docker.m.daocloud.io/prom/node-exporter:v1.8.2
    container_name: recruit-vm1-node-exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - recruit-vm1-net

  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:v2.55.1
    container_name: recruit-vm1-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./monitoring/secrets:/etc/prometheus/secrets:ro"
      - "prometheus-data:/prometheus"
    depends_on:
      - gateway-service
      - node-exporter
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - recruit-vm1-net

  grafana:
    image: docker.m.daocloud.io/grafana/grafana-oss:11.4.0
    container_name: recruit-vm1-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123456}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro"
      - "./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro"
      - "./monitoring/dashboards:/var/lib/grafana/dashboards:ro"
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - recruit-vm1-net
