name: ai-campus-recruit-vm1

networks:
  recruit-vm1-net:
    driver: bridge

volumes:
  nacos-data:
  prometheus-data:
  grafana-data:

services:
  nacos:
    image: docker.m.daocloud.io/nacos/nacos-server:v2.4.3
    container_name: recruit-vm1-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - recruit-vm1-net

  gateway-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: gateway-service
    container_name: recruit-vm1-gateway-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      AUTH_SERVICE_URI: http://${VM2_HOST}:8101
      USER_SERVICE_URI: http://${VM2_HOST}:8102
      RESUME_SERVICE_URI: http://${VM2_HOST}:8103
      JOB_SERVICE_URI: http://${VM2_HOST}:8104
      MATCH_SERVICE_URI: http://${VM2_HOST}:8105
      DELIVERY_SERVICE_URI: http://${VM2_HOST}:8107
      AI_SERVICE_URI: http://${VM3_HOST}:8106
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-ai-campus-recruit}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-86400}
      GATEWAY_AUTH_ENABLED: ${GATEWAY_AUTH_ENABLED:-true}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    depends_on:
      - nacos
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - recruit-vm1-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: recruit-vm1-frontend
    environment:
      GATEWAY_UPSTREAM: http://gateway-service:8080
    depends_on:
      - gateway-service
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - recruit-vm1-net

  node-exporter:
    image: docker.m.daocloud.io/prom/node-exporter:v1.8.2
    container_name: recruit-vm1-node-exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - recruit-vm1-net

  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:v2.55.1
    container_name: recruit-vm1-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus-data:/prometheus"
    depends_on:
      - gateway-service
      - node-exporter
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - recruit-vm1-net

  grafana:
    image: docker.m.daocloud.io/grafana/grafana-oss:11.4.0
    container_name: recruit-vm1-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123456}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro"
      - "./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro"
      - "./monitoring/dashboards:/var/lib/grafana/dashboards:ro"
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - recruit-vm1-net
