name: ai-campus-recruit-vm3

networks:
  recruit-vm3-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    container_name: recruit-vm3-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_campus_recruit}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - recruit-vm3-net

  redis:
    image: docker.m.daocloud.io/library/redis:7.4-alpine
    container_name: recruit-vm3-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - recruit-vm3-net

  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: recruit-vm3-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - recruit-vm3-net

  rocketmq-namesrv:
    image: docker.m.daocloud.io/apache/rocketmq:5.3.0
    container_name: recruit-vm3-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9876"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "9876:9876"
    networks:
      - recruit-vm3-net

  rocketmq-broker:
    image: docker.m.daocloud.io/apache/rocketmq:5.3.0
    container_name: recruit-vm3-rocketmq-broker
    restart: unless-stopped
    command: >
      sh -c "{ echo 'brokerClusterName=DefaultCluster'; echo 'brokerName=broker-a'; echo 'brokerId=0'; echo 'brokerRole=ASYNC_MASTER'; echo 'flushDiskType=ASYNC_FLUSH'; echo 'autoCreateTopicEnable=true'; echo \"brokerIP1=$$BROKER_IP1\"; } > /home/rocketmq/broker.conf &&
      sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf"
    environment:
      BROKER_IP1: ${VM3_HOST}
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/10911"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "10909:10909"
      - "10911:10911"
    networks:
      - recruit-vm3-net

  milvus-etcd:
    image: quay.m.daocloud.io/coreos/etcd:v3.5.18
    container_name: recruit-vm3-milvus-etcd
    restart: unless-stopped
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    networks:
      - recruit-vm3-net

  milvus-minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: recruit-vm3-milvus-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_KEY:-minioadmin}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - milvus-minio-data:/data
    networks:
      - recruit-vm3-net

  milvus-standalone:
    image: docker.m.daocloud.io/milvusdb/milvus:v2.4.15
    container_name: recruit-vm3-milvus-standalone
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      milvus-etcd:
        condition: service_started
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 45s
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HTTP_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    networks:
      - recruit-vm3-net

  ai-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: ai-service
    container_name: recruit-vm3-ai-service
    restart: unless-stopped
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_TEMPERATURE: ${DASHSCOPE_TEMPERATURE:-0.2}
      DASHSCOPE_MAX_TOKENS: ${DASHSCOPE_MAX_TOKENS:-8192}
      DASHSCOPE_CONNECT_TIMEOUT: ${DASHSCOPE_CONNECT_TIMEOUT:-10s}
      DASHSCOPE_READ_TIMEOUT: ${DASHSCOPE_READ_TIMEOUT:-120s}
      DASHSCOPE_MAX_CONCURRENCY: ${DASHSCOPE_MAX_CONCURRENCY:-8}
      DASHSCOPE_ACQUIRE_TIMEOUT: ${DASHSCOPE_ACQUIRE_TIMEOUT:-2s}
      DASHSCOPE_FAILURE_THRESHOLD: ${DASHSCOPE_FAILURE_THRESHOLD:-3}
      DASHSCOPE_CIRCUIT_OPEN_TIME: ${DASHSCOPE_CIRCUIT_OPEN_TIME:-30s}
      AI_KNOWLEDGE_SEMANTIC_ENABLED: ${AI_KNOWLEDGE_SEMANTIC_ENABLED:-true}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
      DASHSCOPE_EMBEDDING_DIMENSION: ${DASHSCOPE_EMBEDDING_DIMENSION:-1024}
      DASHSCOPE_EMBEDDING_URL: ${DASHSCOPE_EMBEDDING_URL:-https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
      DASHSCOPE_RERANK_MODEL: ${DASHSCOPE_RERANK_MODEL:-gte-rerank-v2}
      DASHSCOPE_RERANK_URL: ${DASHSCOPE_RERANK_URL:-https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
      AI_KNOWLEDGE_RERANK_ENABLED: ${AI_KNOWLEDGE_RERANK_ENABLED:-true}
      AI_KNOWLEDGE_INDEX_VERSION: ${AI_KNOWLEDGE_INDEX_VERSION:-semantic-rag-v2}
      AI_KNOWLEDGE_MIN_VECTOR_SIMILARITY: ${AI_KNOWLEDGE_MIN_VECTOR_SIMILARITY:-0.45}
      AI_KNOWLEDGE_MIN_RERANK_SCORE: ${AI_KNOWLEDGE_MIN_RERANK_SCORE:-0.10}
      AI_KNOWLEDGE_CACHE_TTL_SECONDS: ${AI_KNOWLEDGE_CACHE_TTL_SECONDS:-300}
      AI_SCREENING_PERSISTENCE_ENABLED: ${AI_SCREENING_PERSISTENCE_ENABLED:-true}
      AI_PLANNING_PERSISTENCE_ENABLED: ${AI_PLANNING_PERSISTENCE_ENABLED:-true}
      AI_CORE_PERSISTENCE_ENABLED: ${AI_CORE_PERSISTENCE_ENABLED:-true}
      AI_CORE_STRUCTURED_AI_ENABLED: ${AI_CORE_STRUCTURED_AI_ENABLED:-true}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      RESUME_SERVICE_URI: http://${VM2_HOST}:8103
      JOB_SERVICE_URI: http://${VM2_HOST}:8104
      MATCH_SERVICE_URI: http://${VM2_HOST}:8105
      AI_KNOWLEDGE_PERSISTENCE_ENABLED: ${AI_KNOWLEDGE_PERSISTENCE_ENABLED:-true}
      AI_KNOWLEDGE_SEED_ENABLED: ${AI_KNOWLEDGE_SEED_ENABLED:-true}
      AI_KNOWLEDGE_SEED_LOCATIONS: "${AI_KNOWLEDGE_SEED_LOCATIONS:-classpath*:/knowledge/*.json}"
      AI_KNOWLEDGE_CORPUS_VERSION: ${AI_KNOWLEDGE_CORPUS_VERSION:-v3.10-campus-rag-corpus}
      AI_KNOWLEDGE_INGESTION_MAX_FILE_BYTES: ${AI_KNOWLEDGE_INGESTION_MAX_FILE_BYTES:-10485760}
      AI_KNOWLEDGE_INGESTION_MAX_FILE_SIZE: ${AI_KNOWLEDGE_INGESTION_MAX_FILE_SIZE:-10MB}
      AI_KNOWLEDGE_INGESTION_MAX_REQUEST_SIZE: ${AI_KNOWLEDGE_INGESTION_MAX_REQUEST_SIZE:-12MB}
      AI_KNOWLEDGE_OBJECT_STORAGE_ENABLED: ${AI_KNOWLEDGE_OBJECT_STORAGE_ENABLED:-true}
      AI_KNOWLEDGE_MINIO_BUCKET: ${AI_KNOWLEDGE_MINIO_BUCKET:-knowledge}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AI_KNOWLEDGE_VECTOR_ENABLED: ${AI_KNOWLEDGE_VECTOR_ENABLED:-true}
      AI_KNOWLEDGE_VECTOR_PROVIDER: ${AI_KNOWLEDGE_VECTOR_PROVIDER:-milvus-rest}
      MILVUS_ENDPOINT: ${MILVUS_ENDPOINT:-http://milvus-standalone:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-campus_knowledge_semantic_v4_1024}
      MILVUS_DIMENSION: ${MILVUS_DIMENSION:-1024}
      AI_SCREENING_CACHE_TTL: ${AI_SCREENING_CACHE_TTL:-10m}
      AI_SCREENING_ROCKETMQ_ENABLED: ${AI_SCREENING_ROCKETMQ_ENABLED:-true}
      AI_SCREENING_ROCKETMQ_CONSUMER_GROUP: ${AI_SCREENING_ROCKETMQ_CONSUMER_GROUP:-ai-screening-consumer}
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      DELIVERY_EVENTS_TOPIC: ${DELIVERY_EVENTS_TOPIC:-delivery-events}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_campus_recruit}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8106/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
    ports:
      - "8106:8106"
    networks:
      - recruit-vm3-net

  node-exporter:
    image: docker.m.daocloud.io/prom/node-exporter:v1.8.2
    container_name: recruit-vm3-node-exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - recruit-vm3-net
