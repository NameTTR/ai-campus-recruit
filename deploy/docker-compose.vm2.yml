name: ai-campus-recruit-vm2

networks:
  recruit-vm2-net:
    driver: bridge

services:
  auth-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    container_name: recruit-vm2-auth-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
    ports:
      - "8101:8101"
    networks:
      - recruit-vm2-net

  user-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    container_name: recruit-vm2-user-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
    ports:
      - "8102:8102"
    networks:
      - recruit-vm2-net

  resume-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: resume-service
    container_name: recruit-vm2-resume-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
      AI_SERVICE_URI: http://${VM3_HOST}:8106
      RESUME_OBJECT_STORAGE_ENABLED: "true"
      MINIO_ENDPOINT: http://${VM3_HOST}:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-resumes}
    ports:
      - "8103:8103"
    networks:
      - recruit-vm2-net

  job-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: job-service
    container_name: recruit-vm2-job-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
      AI_SERVICE_URI: http://${VM3_HOST}:8106
      JOB_PERSISTENCE_ENABLED: ${JOB_PERSISTENCE_ENABLED:-true}
      JOB_CACHE_TTL: ${JOB_CACHE_TTL:-10m}
      SPRING_DATASOURCE_URL: jdbc:mysql://${VM3_HOST}:3306/${MYSQL_DATABASE:-ai_campus_recruit}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      SPRING_DATA_REDIS_HOST: ${VM3_HOST}
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8104:8104"
    networks:
      - recruit-vm2-net

  match-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: match-service
    container_name: recruit-vm2-match-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
    ports:
      - "8105:8105"
    networks:
      - recruit-vm2-net

  delivery-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: delivery-service
    container_name: recruit-vm2-delivery-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
      DELIVERY_PERSISTENCE_ENABLED: ${DELIVERY_PERSISTENCE_ENABLED:-true}
      DELIVERY_CACHE_TTL: ${DELIVERY_CACHE_TTL:-10m}
      SPRING_DATASOURCE_URL: jdbc:mysql://${VM3_HOST}:3306/${MYSQL_DATABASE:-ai_campus_recruit}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      SPRING_DATA_REDIS_HOST: ${VM3_HOST}
      SPRING_DATA_REDIS_PORT: 6379
      DELIVERY_EVENTS_ROCKETMQ_ENABLED: ${DELIVERY_EVENTS_ROCKETMQ_ENABLED:-true}
      ROCKETMQ_NAME_SERVER: ${VM3_HOST}:9876
      DELIVERY_EVENTS_TOPIC: ${DELIVERY_EVENTS_TOPIC:-delivery-events}
    ports:
      - "8107:8107"
    networks:
      - recruit-vm2-net
