name: ai-campus-recruit-vm2

networks:
  recruit-vm2-net:
    driver: bridge

services:
  auth-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    container_name: recruit-vm2-auth-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
    ports:
      - "8101:8101"
    networks:
      - recruit-vm2-net

  user-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    container_name: recruit-vm2-user-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
    ports:
      - "8102:8102"
    networks:
      - recruit-vm2-net

  resume-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: resume-service
    container_name: recruit-vm2-resume-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
      AI_SERVICE_URI: http://${VM3_HOST}:8106
    ports:
      - "8103:8103"
    networks:
      - recruit-vm2-net

  job-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: job-service
    container_name: recruit-vm2-job-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
      AI_SERVICE_URI: http://${VM3_HOST}:8106
    ports:
      - "8104:8104"
    networks:
      - recruit-vm2-net

  match-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: match-service
    container_name: recruit-vm2-match-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
    ports:
      - "8105:8105"
    networks:
      - recruit-vm2-net

  delivery-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE: delivery-service
    container_name: recruit-vm2-delivery-service
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: ${VM1_HOST}:8848
    ports:
      - "8107:8107"
    networks:
      - recruit-vm2-net
