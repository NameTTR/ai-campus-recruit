server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: openapi-auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8101}
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - SetPath=/v3/api-docs
        - id: openapi-user-service
          uri: ${USER_SERVICE_URI:http://localhost:8102}
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - SetPath=/v3/api-docs
        - id: openapi-resume-service
          uri: ${RESUME_SERVICE_URI:http://localhost:8103}
          predicates:
            - Path=/v3/api-docs/resume-service
          filters:
            - SetPath=/v3/api-docs
        - id: openapi-job-service
          uri: ${JOB_SERVICE_URI:http://localhost:8104}
          predicates:
            - Path=/v3/api-docs/job-service
          filters:
            - SetPath=/v3/api-docs
        - id: openapi-match-service
          uri: ${MATCH_SERVICE_URI:http://localhost:8105}
          predicates:
            - Path=/v3/api-docs/match-service
          filters:
            - SetPath=/v3/api-docs
        - id: openapi-ai-service
          uri: ${AI_SERVICE_URI:http://localhost:8106}
          predicates:
            - Path=/v3/api-docs/ai-service
          filters:
            - SetPath=/v3/api-docs
        - id: openapi-delivery-service
          uri: ${DELIVERY_SERVICE_URI:http://localhost:8107}
          predicates:
            - Path=/v3/api-docs/delivery-service
          filters:
            - SetPath=/v3/api-docs
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8101}
          predicates:
            - Path=/api/auth/**,/api/admin/accounts/**,/api/accounts/**
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8102}
          predicates:
            - Path=/api/students/**,/api/admin/**
        - id: resume-service
          uri: ${RESUME_SERVICE_URI:http://localhost:8103}
          predicates:
            - Path=/api/resumes/**
        - id: job-service
          uri: ${JOB_SERVICE_URI:http://localhost:8104}
          predicates:
            - Path=/api/jobs/**
        - id: match-service
          uri: ${MATCH_SERVICE_URI:http://localhost:8105}
          predicates:
            - Path=/api/matches/**
        - id: ai-service
          uri: ${AI_SERVICE_URI:http://localhost:8106}
          predicates:
            - Path=/api/ai/**
        - id: delivery-service
          uri: ${DELIVERY_SERVICE_URI:http://localhost:8107}
          predicates:
            - Path=/api/deliveries/**,/api/notifications/**,/api/interviews/schedules/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
