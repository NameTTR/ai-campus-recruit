server:
  port: 8105

spring:
  application:
    name: match-service
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

services:
  resume: ${RESUME_SERVICE_URI:http://localhost:8103}
  job: ${JOB_SERVICE_URI:http://localhost:8104}

demo:
  seed:
    enabled: ${DEMO_SEED_ENABLED:false}

match:
  persistence:
    enabled: ${MATCH_PERSISTENCE_ENABLED:false}
  cache:
    ttl: ${MATCH_CACHE_TTL:10m}
    key-prefix: ${MATCH_CACHE_KEY_PREFIX:match:results}

management:
  health:
    db:
      enabled: ${MATCH_DB_HEALTH_ENABLED:false}
    redis:
      enabled: ${MATCH_REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: ${KNIFE4J_ENABLED:true}
  setting:
    language: zh_cn
