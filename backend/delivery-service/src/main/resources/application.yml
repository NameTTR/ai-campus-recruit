server:
  port: 8107

spring:
  application:
    name: delivery-service
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

delivery:
  persistence:
    enabled: ${DELIVERY_PERSISTENCE_ENABLED:false}
  cache:
    ttl: ${DELIVERY_CACHE_TTL:10m}
    key-prefix: ${DELIVERY_CACHE_KEY_PREFIX:delivery:records}
  events:
    rocketmq:
      enabled: ${DELIVERY_EVENTS_ROCKETMQ_ENABLED:false}
      name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
      producer-group: ${DELIVERY_EVENTS_PRODUCER_GROUP:delivery-service-producer}
      topic: ${DELIVERY_EVENTS_TOPIC:delivery-events}

management:
  health:
    db:
      enabled: ${DELIVERY_DB_HEALTH_ENABLED:false}
    redis:
      enabled: ${DELIVERY_REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
