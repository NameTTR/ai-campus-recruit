server:
  port: 8107

spring:
  application:
    name: delivery-service
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

delivery:
  events:
    rocketmq:
      enabled: ${DELIVERY_EVENTS_ROCKETMQ_ENABLED:false}
      name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
      producer-group: ${DELIVERY_EVENTS_PRODUCER_GROUP:delivery-service-producer}
      topic: ${DELIVERY_EVENTS_TOPIC:delivery-events}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
