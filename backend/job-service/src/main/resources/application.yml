server:
  port: 8104

spring:
  application:
    name: job-service
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${FEIGN_READ_TIMEOUT_MS:30000}

services:
  ai: ${AI_SERVICE_URI:http://localhost:8106}

demo:
  seed:
    enabled: ${DEMO_SEED_ENABLED:false}

job:
  persistence:
    enabled: ${JOB_PERSISTENCE_ENABLED:false}
  cache:
    ttl: ${JOB_CACHE_TTL:10m}
    key-prefix: ${JOB_CACHE_KEY_PREFIX:job:records}

management:
  health:
    db:
      enabled: ${JOB_DB_HEALTH_ENABLED:false}
    redis:
      enabled: ${JOB_REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: ${KNIFE4J_ENABLED:true}
  setting:
    language: zh_cn
