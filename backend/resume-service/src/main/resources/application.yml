server:
  port: 8103

spring:
  application:
    name: resume-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

services:
  ai: ${AI_SERVICE_URI:http://localhost:8106}

resume:
  persistence:
    enabled: ${RESUME_PERSISTENCE_ENABLED:false}
  cache:
    ttl: ${RESUME_CACHE_TTL:10m}
    key-prefix: ${RESUME_CACHE_KEY_PREFIX:resume:summaries}
  storage:
    enabled: ${RESUME_OBJECT_STORAGE_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:resumes}

management:
  health:
    db:
      enabled: ${RESUME_DB_HEALTH_ENABLED:false}
    redis:
      enabled: ${RESUME_REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
