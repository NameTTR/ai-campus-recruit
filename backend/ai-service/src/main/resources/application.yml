server:
  port: 8106

spring:
  application:
    name: ai-service
  servlet:
    multipart:
      max-file-size: ${AI_KNOWLEDGE_INGESTION_MAX_FILE_SIZE:10MB}
      max-request-size: ${AI_KNOWLEDGE_INGESTION_MAX_REQUEST_SIZE:12MB}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  model: ${DASHSCOPE_MODEL:qwen-plus}
  base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  temperature: ${DASHSCOPE_TEMPERATURE:0.2}
  max-tokens: ${DASHSCOPE_MAX_TOKENS:8192}
  connect-timeout: ${DASHSCOPE_CONNECT_TIMEOUT:10s}
  read-timeout: ${DASHSCOPE_READ_TIMEOUT:120s}
  max-concurrency: ${DASHSCOPE_MAX_CONCURRENCY:8}
  acquire-timeout: ${DASHSCOPE_ACQUIRE_TIMEOUT:2s}
  failure-threshold: ${DASHSCOPE_FAILURE_THRESHOLD:3}
  circuit-open-time: ${DASHSCOPE_CIRCUIT_OPEN_TIME:30s}

demo:
  seed:
    enabled: ${DEMO_SEED_ENABLED:false}

ai:
  screening:
    persistence:
      enabled: ${AI_SCREENING_PERSISTENCE_ENABLED:false}
    cache:
      ttl: ${AI_SCREENING_CACHE_TTL:10m}
      key-prefix: ${AI_SCREENING_CACHE_KEY_PREFIX:ai:screening:records}
    tasks:
      max-size: ${AI_SCREENING_TASK_MAX_SIZE:100}
    rocketmq:
      enabled: ${AI_SCREENING_ROCKETMQ_ENABLED:false}
      name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
      consumer-group: ${AI_SCREENING_ROCKETMQ_CONSUMER_GROUP:ai-screening-consumer}
      topic: ${DELIVERY_EVENTS_TOPIC:delivery-events}
  planning:
    persistence:
      enabled: ${AI_PLANNING_PERSISTENCE_ENABLED:false}
  core:
    persistence:
      enabled: ${AI_CORE_PERSISTENCE_ENABLED:false}
    context:
      connect-timeout: ${AI_CORE_CONTEXT_CONNECT_TIMEOUT:2s}
      read-timeout: ${AI_CORE_CONTEXT_READ_TIMEOUT:5s}
  knowledge:
    persistence:
      enabled: ${AI_KNOWLEDGE_PERSISTENCE_ENABLED:false}
    ingestion:
      max-file-bytes: ${AI_KNOWLEDGE_INGESTION_MAX_FILE_BYTES:10485760}
      max-text-chars: ${AI_KNOWLEDGE_INGESTION_MAX_TEXT_CHARS:120000}
      max-jobs: ${AI_KNOWLEDGE_INGESTION_MAX_JOBS:200}
    storage:
      enabled: ${AI_KNOWLEDGE_OBJECT_STORAGE_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${AI_KNOWLEDGE_MINIO_BUCKET:knowledge}
    semantic:
      enabled: ${AI_KNOWLEDGE_SEMANTIC_ENABLED:true}
      embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
      dimension: ${DASHSCOPE_EMBEDDING_DIMENSION:1024}
      embedding-url: ${DASHSCOPE_EMBEDDING_URL:https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
      rerank-model: ${DASHSCOPE_RERANK_MODEL:gte-rerank-v2}
      rerank-url: ${DASHSCOPE_RERANK_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
      rerank-enabled: ${AI_KNOWLEDGE_RERANK_ENABLED:true}
      concept-gate-enabled: ${AI_KNOWLEDGE_CONCEPT_GATE_ENABLED:true}
      sensitive-query-terms: ${AI_KNOWLEDGE_SENSITIVE_QUERY_TERMS:隐私,个人信息,个人资料,个人档案,医疗,医疗档案,健康档案,病历,凭据,密码,令牌,未公开,未发布,内部资料,机密,保密,privacy,credential,credentials,medical,personal record,unpublished}
      version: ${AI_KNOWLEDGE_INDEX_VERSION:semantic-rag-v2}
      minimum-vector-similarity: ${AI_KNOWLEDGE_MIN_VECTOR_SIMILARITY:0.45}
      minimum-rerank-score: ${AI_KNOWLEDGE_MIN_RERANK_SCORE:0.10}
      cache-ttl-seconds: ${AI_KNOWLEDGE_CACHE_TTL_SECONDS:300}
    vector:
      enabled: ${AI_KNOWLEDGE_VECTOR_ENABLED:false}
      provider: ${AI_KNOWLEDGE_VECTOR_PROVIDER:milvus-rest}
      endpoint: ${MILVUS_ENDPOINT:http://localhost:19530}
      token: ${MILVUS_TOKEN:}
      collection: ${MILVUS_COLLECTION:campus_knowledge_semantic_v4_1024}
      vector-field: ${MILVUS_VECTOR_FIELD:embedding}
      dimension: ${MILVUS_DIMENSION:1024}
    seed:
      enabled: ${AI_KNOWLEDGE_SEED_ENABLED:true}
      locations: ${AI_KNOWLEDGE_SEED_LOCATIONS:classpath*:/knowledge/*.json}
      corpus-version: ${AI_KNOWLEDGE_CORPUS_VERSION:v3.10-campus-rag-corpus}

management:
  health:
    db:
      enabled: ${AI_SCREENING_DB_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: ${KNIFE4J_ENABLED:true}
  setting:
    language: zh_cn
